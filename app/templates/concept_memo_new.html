{% extends "base.html" %}
{% block content %}
<section class="panel">
  <h2>概念メモを作成</h2>
  <form method="post" action="/concept-memos/save" class="stack form-validate">
    <p class="form-error" hidden></p>
    <label>
      タイトル
      <input type="text" name="title" required />
    </label>
    <label>
      内容
      <textarea name="content" rows="12" required></textarea>
    </label>
    <button type="submit">保存</button>
  </form>
</section>
{% endblock %}
